# Fecha: 2026-11-01
# Ruta: /.github/workflows/ios.yml
# App «Kebat» para iPhone: se compila en el Mac de GitHub (no hace falta Mac en casa).
#   1. simulador: compila sin firma y la arranca en un iPhone simulado con capturas. No pide secretos.
#   2. testflight: firma y sube a TestFlight. Secretos del equipo DNNS: APPLE_CERT_P12 / APPLE_CERT_PASSWORD
#      (certificado Apple Distribution), APPLE_PROFILE (perfil «Kebat App Store» de es.dnns.kebat), APPLE_TEAM_ID
#      y la clave de App Store Connect APPLE_ASC_KEY_P8 / APPLE_ASC_KEY_ID / APPLE_ASC_ISSUER_ID.
# Notas: con cada etiqueta vX.Y.Z se sube a TestFlight; a mano (Actions → iOS → Run workflow) se elige.
#        Versión = la de package.json (la misma que Android); build = número de ejecución.
#        Repo privado: cada minuto de Mac gasta 10 de cuota → solo con etiqueta o a mano, nunca en cada push.
#        A diferencia de Casos (SPM), este proyecto usa CocoaPods: pod install + build del .xcworkspace.

name: iOS

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      subir:
        description: 'Subir a TestFlight (si no, solo comprueba en el simulador)'
        type: boolean
        default: true

jobs:
  simulador:
    name: Compilar y arrancar en el simulador
    if: github.event_name == 'workflow_dispatch' && !inputs.subir
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync iOS + pods
        run: |
          npm ci
          npx cap sync ios
          cd ios/App && pod install

      - name: Compilar (simulador, sin firma)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet \
            build

      - name: Arrancar en un iPhone simulado
        run: |
          set -e
          UDID=$(xcrun simctl list devices available --json \
              | jq -r '.devices | to_entries | map(select(.key | test("iOS"))) | .[].value[] | select(.name | test("iPhone")) | .udid' | head -1)
          [ -n "$UDID" ] || { echo "No hay simulador de iPhone"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p capturas
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'process == "App"' > capturas/registro.txt 2>&1 &
          xcrun simctl launch "$UDID" es.dnns.kebat
          for s in 5 15 30; do
            sleep $((s == 5 ? 5 : s == 15 ? 10 : 15))
            xcrun simctl io "$UDID" screenshot "capturas/arranque-${s}s.png"
          done
          kill %1 || true
          grep -E '⚡️|\[error\]|\[warn\]|Error|error' capturas/registro.txt | head -80 || true
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "es.dnns.kebat"; then
            echo "La app sigue viva"
          else
            echo "LA APP SE HA CERRADO SOLA"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kebat-ios-simulador
          path: capturas
          if-no-files-found: warn
          retention-days: 14

  testflight:
    name: Firmar y subir a TestFlight
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.subir)
    runs-on: macos-26
    timeout-minutes: 40
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
      APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - name: Comprobar secretos
        run: |
          if [ -z "$APPLE_CERT_P12" ] || [ -z "$APPLE_PROFILE" ] || [ -z "$APPLE_ASC_KEY_P8" ]; then
            echo "::error::Faltan los secretos de Apple: no se puede firmar ni subir."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync iOS + pods
        run: |
          npm ci
          npx cap sync ios
          cd ios/App && pod install

      # Apple exige el SDK más nuevo: se elige siempre el Xcode más reciente del runner
      - name: Usar el Xcode más nuevo
        run: |
          ULTIMO=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Xcode elegido: $ULTIMO"
          sudo xcode-select -s "$ULTIMO"
          xcodebuild -version

      - name: Certificado y perfil
        run: |
          set -e
          LLAVERO="$RUNNER_TEMP/firma.keychain-db"
          CLAVE_LLAVERO="$(uuidgen)"
          security create-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          security set-keychain-settings -lut 21600 "$LLAVERO"
          security unlock-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$LLAVERO"
          curl -sSfo "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$LLAVERO" -A || echo "El intermedio WWDR ya estaba."
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CLAVE_LLAVERO" "$LLAVERO" > /dev/null
          security list-keychains -d user -s "$LLAVERO" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$LLAVERO"
          rm -f "$RUNNER_TEMP/distribution.p12"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            echo "$APPLE_PROFILE" | base64 --decode > "$d/kebat-app-store.mobileprovision"
          done

      - name: Archivar (firmado)
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "Kebat $VERSION ($GITHUB_RUN_NUMBER)"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kebat.xcarchive" \
            -derivedDataPath ios/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Kebat App Store" \
            -quiet \
            archive

      - name: Subir a TestFlight
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$APPLE_ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>es.dnns.kebat</key><string>Kebat App Store</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kebat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$APPLE_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
