# Fecha: 2026-11-01
# Ruta: /.github/workflows/ios.yml
# Kebat — app iOS (Capacitor + CocoaPods) compilada en GitHub Actions (no hay Mac en casa).
#
# Dos destinos, elegidos al lanzarlo a mano (el panel iosDNNS usa 'adhoc'):
#   simulador  compila sin firmar, para saber si el proyecto está sano.
#   adhoc      firma de verdad y deja un .ipa instalable en los iPhones
#              que estén dentro del perfil «Kebat Ad Hoc».
#
# Secretos: APPLE_CERT_P12 / APPLE_CERT_PASSWORD (Apple Distribution),
#   APPLE_PROFILE_ADHOC (perfil «Kebat Ad Hoc» en base64, lo rehace el panel
#   iosDNNS cuando cambian los dispositivos) y APPLE_TEAM_ID.
# La firma (equipo, identidad, perfil) vive en el TARGET App del proyecto, no en
# la línea de comandos: pasada ahí se aplicaría también a los Pods y fallaría.

name: iOS

on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'Qué hacer con la compilación'
        type: choice
        default: simulador
        options: [simulador, adhoc]

jobs:
  simulador:
    name: Compilar para el simulador
    if: inputs.destino == 'simulador'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync iOS + pods
        run: |
          npm ci
          npx cap sync ios
          cd ios/App && pod install --repo-update

      - name: Compilar (simulador, sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet \
            build

  adhoc:
    name: Firmar Ad Hoc
    if: inputs.destino == 'adhoc'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_PROFILE_ADHOC: ${{ secrets.APPLE_PROFILE_ADHOC }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Comprobar secretos
        id: secretos
        run: |
          if [ -n "$APPLE_CERT_P12" ] && [ -n "$APPLE_PROFILE_ADHOC" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Faltan APPLE_CERT_P12 o APPLE_PROFILE_ADHOC."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync iOS + pods
        run: |
          # La app enseña y compara su versión completa (x.y.z.build) gracias a esto
          echo "window.KEBAT_BUILD = $GITHUB_RUN_NUMBER;" > www/js/build.js
          npm ci
          npx cap sync ios
          cd ios/App && pod install --repo-update

      - name: Certificado y perfil
        run: |
          set -e
          LLAVERO="$RUNNER_TEMP/firma.keychain-db"
          CLAVE_LLAVERO="$(uuidgen)"
          security create-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          security set-keychain-settings -lut 21600 "$LLAVERO"
          security unlock-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$LLAVERO"
          curl -sSfo "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$LLAVERO" -A || echo "El intermedio WWDR ya estaba."
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CLAVE_LLAVERO" "$LLAVERO" > /dev/null
          security list-keychains -d user -s "$LLAVERO" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$LLAVERO"
          rm -f "$RUNNER_TEMP/distribution.p12"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            echo "$APPLE_PROFILE_ADHOC" | base64 --decode > "$d/kebat-ad-hoc.mobileprovision"
          done

      # La firma está en el target App del proyecto (CODE_SIGN_STYLE Manual,
      # perfil «Kebat Ad Hoc»); aquí solo versión y número de build.
      - name: Archivar (firmado)
        run: |
          set -o pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "Kebat $VERSION ($GITHUB_RUN_NUMBER)"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kebat.xcarchive" \
            -derivedDataPath ios/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -quiet \
            archive

      - name: Exportar .ipa
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>es.dnns.kebat</key><string>Kebat Ad Hoc</string></dict>
            <key>compileBitcode</key><false/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kebat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -lh "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: kebat-ios-adhoc
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
